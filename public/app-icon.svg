<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#141d3b" />
      <stop offset="55%" stop-color="#080c1d" />
      <stop offset="100%" stop-color="#030409" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Plate Gradients -->
    <linearGradient id="glass-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glass-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glass-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Gloss Sheen Gradients -->
    <linearGradient id="gloss-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="gloss-side-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />

  <!-- Ambient background glow behind the cube -->
  <circle cx="180" cy="300" r="160" fill="#00ffcc" opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="330" cy="220" r="160" fill="#bd00ff" opacity="0.15" filter="url(#glow-purple)" />

  <!-- 3D CUBE STRUCTURE GROUP -->
  <g transform="translate(0, 0)">

    <!-- ==================== CUBE CHASSIS GLOW (BACK / UNDER LAYER) ==================== -->
    <!-- Cyan Glowing Outline (Left/Top/Front-Vertical) -->
    <path d="M 256,115 L 130.4,187.5 L 130.4,332.5 L 256,405 M 256,260 L 130.4,187.5 M 256,260 L 256,405" 
          fill="none" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow-cyan)" />

    <!-- Purple Glowing Outline (Right/Back-Vertical) -->
    <path d="M 256,115 L 381.6,187.5 L 381.6,332.5 L 256,405 M 256,260 L 381.6,187.5" 
          fill="none" stroke="#bd00ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow-purple)" />

    <!-- ==================== GLASS PLATES & GRIDS (MID LAYER) ==================== -->
    
    <!-- 1. TOP FACE PANEL -->
    <!-- Rounded Glass Plate -->
    <path d="M 247,132.5 L 155.6,182.5 Q 146.6,187.5 155.6,192.5 L 247,242.5 Q 256,247.5 265,242.5 L 356.4,192.5 Q 365.4,187.5 356.4,182.5 L 265,132.5 Q 256,127.5 247,132.5 Z" 
          fill="rgba(16, 30, 56, 0.65)" stroke="url(#glass-top)" stroke-width="1.5" />
    <!-- Grid Lines -->
    <g stroke="#00f0ff" stroke-width="1.2" opacity="0.22">
      <line x1="219.5" y1="147.5" x2="328.9" y2="207.5" />
      <line x1="183.1" y1="167.5" x2="292.5" y2="227.5" />
      <line x1="292.5" y1="147.5" x2="183.1" y2="207.5" />
      <line x1="328.9" y1="167.5" x2="219.5" y2="227.5" />
    </g>
    <!-- Diagonal Gloss Sheen -->
    <path d="M 256,127.5 L 146.6,187.5 L 256,247.5 Z" fill="url(#gloss-top-grad)" />

    <!-- 2. LEFT FACE PANEL -->
    <!-- Rounded Glass Plate -->
    <path d="M 141.4,204.5 L 141.4,313.5 Q 141.4,323.5 150.4,329.5 L 237.4,387.5 Q 246.4,393.5 246.4,383.5 L 246.4,274.5 Q 246.4,264.5 237.4,258.5 L 150.4,200.5 Q 141.4,194.5 141.4,204.5 Z" 
          fill="rgba(12, 24, 46, 0.65)" stroke="url(#glass-left)" stroke-width="1.5" />
    <!-- Grid Lines -->
    <g stroke="#00f0ff" stroke-width="1.2" opacity="0.22">
      <!-- Verticals -->
      <line x1="176.4" y1="217.8" x2="176.4" y2="346.8" />
      <line x1="211.4" y1="241.2" x2="211.4" y2="370.2" />
      <!-- Slanted -->
      <line x1="141.4" y1="237.5" x2="246.4" y2="307.5" />
      <line x1="141.4" y1="280.5" x2="246.4" y2="350.5" />
    </g>
    <!-- Diagonal Curved Gloss Sheen -->
    <path d="M 141.4,204.5 L 246.4,264.5 C 200,285 160,305 141.4,323.5 Z" fill="url(#gloss-side-grad)" />

    <!-- 3. RIGHT FACE PANEL -->
    <!-- Rounded Glass Plate -->
    <path d="M 265.6,274.5 L 265.6,383.5 Q 265.6,393.5 274.6,387.5 L 361.6,329.5 Q 370.6,323.5 370.6,313.5 L 370.6,204.5 Q 370.6,194.5 361.6,188.5 L 274.6,258.5 Q 265.6,264.5 265.6,274.5 Z" 
          fill="rgba(12, 22, 46, 0.65)" stroke="url(#glass-right)" stroke-width="1.5" />
    <!-- Grid Lines -->
    <g stroke="#00e5ff" stroke-width="1.2" opacity="0.22">
      <!-- Verticals -->
      <line x1="300.6" y1="241.2" x2="300.6" y2="370.2" />
      <line x1="335.6" y1="217.8" x2="335.6" y2="346.8" />
      <!-- Slanted -->
      <line x1="265.6" y1="307.5" x2="370.6" y2="237.5" />
      <line x1="265.6" y1="350.5" x2="370.6" y2="280.5" />
    </g>
    <!-- Diagonal Curved Gloss Sheen -->
    <path d="M 265.6,264.5 L 370.6,194.5 C 320,225 285,255 265.6,315 Z" fill="url(#gloss-side-grad)" />

    <!-- ==================== FLOATING NUMBERS / CHARACTERS ==================== -->
    <!-- Top Face "3" (Cyan/White Glow) -->
    <text transform="matrix(0.866, 0.5, -0.866, 0.5, 256, 187.5)" 
          font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="70" 
          fill="#ffffff" text-anchor="middle" dominant-baseline="central" 
          style="text-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 4px rgba(255,255,255,1);">3</text>

    <!-- Left Face "9" (Cyan/White Glow) -->
    <text transform="matrix(0.866, 0.5, 0, 1, 193.9, 294)" 
          font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="70" 
          fill="#ffffff" text-anchor="middle" dominant-baseline="central" 
          style="text-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 4px rgba(255,255,255,1);">9</text>

    <!-- Right Face "D" (Purple/White Glow) -->
    <text transform="matrix(0.866, -0.5, 0, 1, 318.1, 294)" 
          font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="70" 
          fill="#ffffff" text-anchor="middle" dominant-baseline="central" 
          style="text-shadow: 0 0 16px rgba(189, 0, 255, 0.9), 0 0 4px rgba(255,255,255,1);">D</text>

    <!-- ==================== CUBE CHASSIS BORDERS (FRONT / OVER LAYER) ==================== -->
    <!-- Thin crisp light lines to create the glossy sharp edge profile -->
    <path d="M 256,115 L 130.4,187.5 L 130.4,332.5 L 256,405 M 256,260 L 130.4,187.5 M 256,260 L 256,405" 
          fill="none" stroke="#e0ffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 256,115 L 381.6,187.5 L 381.6,332.5 L 256,405 M 256,260 L 381.6,187.5" 
          fill="none" stroke="#fce6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Super-bright front-corner accents (Bevel reflections) -->
    <line x1="256" y1="260" x2="256" y2="405" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <line x1="256" y1="260" x2="130.4" y2="187.5" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Inner Glassmorphic Frame border for the icon card -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2.5" />
</svg>
