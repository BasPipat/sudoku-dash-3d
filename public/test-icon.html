<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Dash 3D - Icon Test</title>
  <style>
    body {
      background-color: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      flex-direction: column;
      gap: 20px;
    }
    .icon-container {
      width: 384px;
      height: 384px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 100px rgba(189, 0, 255, 0.15);
      border-radius: 80px;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #00e5ff 0%, #bd00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <h1>SUDOKU DASH 3D - MOBILE ICON</h1>
  <div class="icon-container">
    <img src="app-icon.svg" width="100%" height="100%" alt="App Icon">
  </div>
</body>
</html>
